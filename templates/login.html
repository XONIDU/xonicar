{% extends "base.html" %}
{% block title %}Login - XONICAR{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4 col-lg-3">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-wrench display-4" style="color: #3498db;"></i>
                    <h3 class="mt-3 mb-0" style="color: #2c3e50;">Taller Manager</h3>
                    <p class="text-muted">Sistema de Gestión para Talleres</p>
                </div>
                
                <h5 class="mb-4">Iniciar Sesión</h5>
                
                <form method="POST">
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username" 
                                   placeholder="Usuario" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" 
                                   placeholder="Contraseña" required>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 py-2 mb-3" type="submit">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
                    </button>
                </form>
                
                <hr class="my-4">

            </div>
        </div>
    </div>
</div>
{% endblock %}
